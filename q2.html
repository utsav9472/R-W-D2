<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert_banner</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=warning" />
    <style>
        .alert{
            background-color: #fff3cd;
            width: 450px;
            height: 100px;
            border: 1px solid;
            border-color: #f0bf29;
            border-radius:8px;
            color: #f04805;
            margin-left: 500px;
        }
        #warn{
            text-align: center;
            margin-top: -28px;
            
        }
        #par-2{
            text-align: center;
        }
        .material-symbols-outlined{
            margin-left: 160px;
            margin-top:05px;
        }
    </style>
</head>
<body>
    
    <div class="alert">
        <span class="material-symbols-outlined">warning</span>
      <h3 id="warn">Warning</h3>
      <p id="par-2">A warning message is an alert that tells you about a potential danger, error, or risk before it causes harm</p>
    </div>
</body>
</html>
